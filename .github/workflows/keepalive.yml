name: keep-alive
on:
  schedule:
    # Every 10 minutes, 06:00-20:59 UTC (07:00-21:59 in Nigeria). Not 24/7, so the free
    # 750 instance-hours a month are shared fairly with your other Render services.
    - cron: "*/10 6-20 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API and database
        run: curl -fsS --max-time 90 --retry 2 "${{ vars.RENDER_URL }}/health?deep=1"
